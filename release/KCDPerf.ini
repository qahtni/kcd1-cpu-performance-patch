; KCDPerf settings. Lines starting with ; are comments. Without this file the plugin uses the values shown here.
; Changes apply at the next game start.
;
; Far sun shadows. The game redraws shadow cascades 3 and 4 (everything further than about 27 m) together on every
; 2nd frame. With smart 1 they are redrawn every 8th and 16th frame instead, never both in one frame, and at once
; when the camera moves or turns. Near shadows are not changed.
;   stagger a,b,c = redraw period in frames of cascades 2, 3 and 4 (game: 2,2,2)
;   safer for moving shadows of people 27-80 m away, a little slower: stagger 2,4,16
;   patch off (same as the game): smart 0 and stagger 2,2,2
smart 1
stagger 2,8,16
;
; Texture streaming. trim 1 = like the game. trim 0 = skip a slow search the game runs on almost every texture load:
; faster in towns, but the game then uses about 3 GB more video memory. Only for cards with 12 GB or more.
trim 1
